// hlbench1.cfg - record the Half-Life benchmark demo hlbench1.dem: the tram
// ride through c0a0 (world geometry, long views, the opening credits),
// turning full circles and looking up and down on the way. The train moves
// the camera along a fixed track, so the demo does not depend on steering
// through rooms blind. The game runs a fixed 20 ms step (run.sh record starts
// it with +host_framerate 0.02). Recorded by MAP=c0a0 tools/halflife/run.sh
// record (DEMO=hlbench1); the engine execs this file once the level is live.
// The demo derives from the retail game: a local fixture, never committed.
sv_cheats 1
td_nochangelevel 1
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
// at the default speeds (cl_yawspeed 210, cl_pitchspeed 225 degrees a
// second) and 50 frames a second: spin ~357 degrees; look ~45 up, back, ~45
// down, back (the client applies a held look key twice a frame, and weighs
// its first and last frames: four holds of the same length cancel exactly,
// as long as none reaches the +-89 degree limit); viewpos logs the angles
alias spin "+right;w25;w25;w25;w5;w5;-right;viewpos"
alias look "+lookup;w5;-lookup;+lookdown;w5;-lookdown;+lookdown;w5;-lookdown;+lookup;w5;-lookup;viewpos"
w25
record hlbench1
w100;w100;spin;w100;look;w100;w100;spin;w100;look;w100;w100;spin;w100;w100;look;w100
stop
quit
