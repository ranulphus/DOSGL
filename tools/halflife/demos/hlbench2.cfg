// hlbench2.cfg - record the Half-Life benchmark demo hlbench2.dem: c1a2, the
// map with the most monsters in the data (70, against 19 in c2a1), turning
// full circles and a few steps from the start, firing the MP5 (muzzle
// flashes, decals) at whatever comes (god mode: the recording never dies;
// td_nochangelevel: it never leaves the level). The game runs a fixed 20 ms
// step (run.sh record starts it with +host_framerate 0.02). Recorded by
// DEMO=hlbench2 MAP=c1a2 tools/halflife/run.sh record. The demo derives
// from the retail game: a local fixture, never committed.
sv_cheats 1
td_nochangelevel 1
god
impulse 101
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
w25
use weapon_9mmAR
// as hlbench1.cfg: spin ~357 degrees, look ~45 up and down and back level;
// step ~135 units, turn ~105 degrees; refill tops the ammunition up
alias step "+forward;w25;-forward"
alias spin "+right;w25;w25;w25;w5;w5;-right;viewpos"
alias turnl "+left;w25;-left"
alias turnr "+right;w25;-right"
alias fire "+attack;w25;-attack"
alias look "+lookup;w5;-lookup;+lookdown;w5;-lookdown;+lookdown;w5;-lookdown;+lookup;w5;-lookup;viewpos"
alias refill "impulse 101;w5;use weapon_9mmAR"
w25
record hlbench2
w25
alias leg1 "spin;fire;step;fire;turnl;step;fire;look;turnr;turnr;step;fire;spin;fire"
alias leg2 "step;fire;turnr;step;fire;look;turnl;turnl;step;fire;spin;fire"
leg1;refill;leg2;refill;leg1;refill;leg2
w25
stop
quit
