// q2bench1.cfg - record the Quake 2 benchmark demo q2bench1.dm2 (protocol 34).
// A scripted walk through base1 with blaster fire (dynamic lights), looking
// around; every frame lasts 14 ms of game time (fixedtime), so the recording
// does not depend on how fast the machine runs. tools/quake/q2record.sh starts
// base1 with td_script set to this file, which the fork execs once the level
// is live.
set fixedtime 14
set cl_run 1
set developer 0
alias w5 "wait;wait;wait;wait;wait"
alias w25 "w5;w5;w5;w5;w5"
alias w100 "w25;w25;w25;w25"
alias go "+forward;w100;-forward"
alias turnl "+left;w25;-left"
alias turnr "+right;w25;-right"
alias fire "+attack;w25;-attack"
alias look "+lookup;w25;-lookup;+lookdown;w25;w25;-lookdown;+lookup;w25;-lookup"
w25
record q2bench1
w25
alias leg1 "go;turnl;fire;go;turnr;turnr;fire;look;go;turnl;fire;go;fire;turnr;go;turnl;turnl;fire;go"
alias leg2 "go;turnr;fire;go;turnl;turnl;fire;look;go;turnr;fire;go;fire;turnl;go;turnr;turnr;fire;go"
leg1;leg2;leg1;leg2
w25
stop
quit
